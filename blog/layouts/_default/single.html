{{ define "main" }}
			<article class="post">
				<header>
					<h1>{{ .Title }}</h1>
					<p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time> · {{ .ReadingTime }} min read</p>
				</header>
				{{ .Content }}
			</article>
			<p class="post-back"><a href="/blog/">← All posts</a></p>
{{ end }}
