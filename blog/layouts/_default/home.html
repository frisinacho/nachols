{{ define "main" }}
			<h1>Blog</h1>
			{{ $posts := where site.RegularPages "Section" "posts" }}
			{{ with $posts }}
			<ul class="post-list">
				{{ range . }}
				<li>
					<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
					<a href="{{ .RelPermalink }}">{{ .Title }}</a>
					{{ with .Description }}<p>{{ . }}</p>{{ end }}
				</li>
				{{ end }}
			</ul>
			{{ else }}
			<p class="wip">No posts yet.</p>
			{{ end }}
{{ end }}
